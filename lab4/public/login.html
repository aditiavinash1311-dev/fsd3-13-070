<!DOCTYPE html><html><head><title>Login - Apex Academy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style></head><body class="bg-gray-50 text-gray-900">
    <header class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl"><i class="fa-solid fa-graduation-cap"></i></div>
                <span class="text-xl font-extrabold text-gray-900 dark:text-white">APEX ACADEMY</span>
            </a>
            <nav class="hidden md:flex space-x-6 text-sm font-semibold">
                <a href="courses.html" class="hover:text-indigo-600">Courses</a>
                <a href="pricing.html" class="hover:text-indigo-600">Pricing Details</a>
                <a href="registration.html" class="hover:text-indigo-600">Registration</a>
                <a href="login.html" class="hover:text-indigo-600">Login</a>
                <a href="feedback.html" class="hover:text-indigo-600">Feedback</a>
            </nav>
        </div>
    </header><main class="max-w-md mx-auto p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-2xl bg-brand-600 text-white flex items-center justify-center text-2xl font-black mx-auto mb-4 shadow-lg shadow-brand-600/30">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white">Portal Access</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Log in to view course progress, test scores &amp; class links.</p>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-gray-200 dark:border-slate-700 shadow-xl">
                <!-- Role Toggle Tabs -->
                <div class="flex bg-gray-100 dark:bg-slate-900 p-1 rounded-2xl mb-6">
                    <button type="button" onclick="setLoginRole('student')" id="role-student" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-brand-600 shadow-sm">Student</button>
                    <button type="button" onclick="setLoginRole('parent')" id="role-parent" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all text-gray-500 dark:text-gray-400">Parent</button>
                    <button type="button" onclick="setLoginRole('tutor')" id="role-tutor" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all text-gray-500 dark:text-gray-400">Tutor</button>
                </div>

                <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Username / Student ID</label>
                        <input type="text" id="login-id" required="" placeholder="e.g. APEX-2026-99" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="login-pass" required="" placeholder="••••••••" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-600 focus:outline-none pr-10">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 text-sm">
                                <i class="fa-solid fa-eye" id="pass-eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between text-xs">
                        <label class="flex items-center gap-2 text-gray-600 dark:text-gray-400">
                            <input type="checkbox" class="rounded text-brand-600"> Remember me
                        </label>
                        <a href="javascript:void(0)" onclick="alert('Password reset link sent to registered email.')" class="text-brand-600 hover:underline font-semibold">Forgot Password?</a>
                    </div>
                    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-brand-600/20">
                        Sign In to Dashboard
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-gray-100 dark:border-slate-700 text-center">
                    <span class="text-xs text-gray-500">Demo Login Access:</span>
                    <button onclick="fillDemoLogin()" class="mt-2 text-xs font-bold text-brand-600 dark:text-brand-400 hover:underline block mx-auto">
                        <i class="fa-solid fa-key mr-1"></i> Auto-fill Demo Student Credentials
                    </button>
                </div>
            </div>
        </main>
    <footer class="bg-slate-950 text-white py-10 mt-12">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-xs text-gray-400 gap-4">
            <p>© 2026 Apex Academy Tuition Classes. All rights reserved.</p>
            <div class="flex space-x-4 text-base">
                <a href="https://facebook.com" class="hover:text-white"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://instagram.com" class="hover:text-white"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://youtube.com" class="hover:text-white"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://whatsapp.com" class="hover:text-white"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </footer></body></html>
